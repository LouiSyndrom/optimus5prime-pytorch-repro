[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optimus5prime-pytorch-repro"
version = "0.1.0"
description = "A simple pipeline for Optimus 5-Prime and three baseline models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "xgboost",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
